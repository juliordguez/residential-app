<h2 mat-dialog-title>{{ isCreateMode() ? 'Crear Deudor' : 'Editar Deudor' }}</h2>

<mat-dialog-content [formGroup]="form">
  <div fxLayout="column" fxLayoutGap="16px">

    <mat-form-field appearance="outline">
      <mat-label>Meses de Deuda</mat-label>
      <input matInput formControlName="meses_deuda" type="number" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Cantidad de Deuda</mat-label>
      <input matInput formControlName="cantidad_deuda" type="number" />
    </mat-form-field>

    <mat-form-field *ngIf="isCreateMode()" appearance="outline">
      <mat-label>Usuario</mat-label>
      <mat-select formControlName="id_user">
        <mat-option [value]="null">-- Selecciona un usuario --</mat-option>
        <mat-option *ngFor="let user of usuarios" [value]="user.id_user">
          {{ user.username }}
        </mat-option>
      </mat-select>
    </mat-form-field>

  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="form.invalid">
    {{ isCreateMode() ? 'Crear' : 'Actualizar' }}
  </button>
</mat-dialog-actions>
