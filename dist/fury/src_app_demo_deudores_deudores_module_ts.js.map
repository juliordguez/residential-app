<fury-page-layout mode="card">
  <fury-page-layout-header>
    <fury-breadcrumbs [@fadeInRight] [crumbs]="['Gestión']" current="Deudores"></fury-breadcrumbs>
  </fury-page-layout-header>

  <fury-page-layout-content [@fadeInUp]>
    <fury-list name="deudores" [columns]="columns" (filterChange)="onFilterChange($event)">
      <div *ngIf="hasPermission('GETDDRSMET01')" class="actions">
        <button class="create" (click)="createDeudor()" type="button" mat-mini-fab color="primary">
          <mat-icon>add</mat-icon>
        </button>
      </div>

      <table [dataSource]="dataSource" mat-table matSort>

        <!-- Checkbox -->
        <ng-container matColumnDef="checkbox">
          <th mat-header-cell *matHeaderCellDef>
            <mat-checkbox color="primary"></mat-checkbox>
          </th>
          <td mat-cell *matCellDef="let row">
            <mat-checkbox color="primary"></mat-checkbox>
          </td>
        </ng-container>

        <!-- Columnas dinámicas -->
        <ng-container *ngFor="let column of columns">
          <ng-container *ngIf="column.isModelProperty" [matColumnDef]="column.property">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ column.name }}</th>
            <td mat-cell *matCellDef="let row">{{ row[column.property] }}</td>
          </ng-container>
        </ng-container>

        <!-- Acciones -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">
            <button *ngIf="hasPermission('DELTDDRMET01') || hasPermission('UPDTDDRMET01')" mat-icon-button [matMenuTriggerFor]="actionsMenu">
              <mat-icon>more_horiz</mat-icon>
            </button>

            <mat-menu #actionsMenu="matMenu" yPosition="below" xPosition="before">
                <ng-container *ngIf="hasPermission('UPDTDDRMET01')">
                  <button (click)="updateDeudor(row)" mat-menu-item>
                    <span>Modify</span>
                  </button>
                </ng-container>

                <ng-container *ngIf="hasPermission('DELTDDRMET01')">
                  <button (click)="deleteDeudor(row)" mat-menu-item>
                    <span>Delete</span>
                  </button>
                </ng-container>
            </mat-menu>
          </td>
        </ng-container>

        <tr *matHeaderRowDef="visibleColumns" mat-header-row></tr>
        <tr (click)="hasPermission('UPDTDDRMET01') && updateDeudor(row)"
            *matRowDef="let row; columns: visibleColumns;"
            class="clickable route-animations-elements"
            mat-row></tr>
      </table>

      <mat-paginator class="paginator"  [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions"></mat-paginator>
    </fury-list>
  </fury-page-layout-content>
</fury-page-layout>
