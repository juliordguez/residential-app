<h2 mat-dialog-title>{{ isCreateMode() ? 'Crear Noticia' : 'Editar Noticia' }}</h2>

<mat-dialog-content [formGroup]="form">
  <div fxLayout="column" fxLayoutGap="16px">

    <mat-form-field appearance="outline">
      <mat-label>Título</mat-label>
      <input matInput formControlName="titulo" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Contenido</mat-label>
      <textarea matInput formControlName="contenido" rows="4"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Estado</mat-label>
      <input matInput formControlName="estado" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Categoría</mat-label>
      <input matInput formControlName="categoria" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Prioridad</mat-label>
      <input matInput formControlName="prioridad" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Fecha de Expiración</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="fecha_expiracion" />
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="form.invalid">
    {{ isCreateMode() ? 'Crear' : 'Actualizar' }}
  </button>
</mat-dialog-actions>
