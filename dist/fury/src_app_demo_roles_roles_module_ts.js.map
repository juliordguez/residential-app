<h2 mat-dialog-title>{{ isCreateMode() ? 'Crear Rol' : 'Editar Rol' }}</h2>

<mat-dialog-content [formGroup]="form">
  <div fxLayout="column" fxLayoutGap="16px">
    <mat-form-field appearance="outline">
      <mat-label>Nombre del Rol</mat-label>
      <input matInput formControlName="name_rol" required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Descripción</mat-label>
      <input matInput formControlName="description" required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>ID Fraccionamiento</mat-label>
      <input matInput type="number" formControlName="id_fraccionamiento" required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>ID Permisos</mat-label>
      <input matInput type="number" formControlName="id_permisos" required />
    </mat-form-field>

  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="form.invalid">
    {{ isCreateMode() ? 'Crear' : 'Guardar' }}
  </button>
</mat-dialog-actions>
