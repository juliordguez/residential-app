<fury-page-layout mode="card">
  <fury-page-layout-header>
    <fury-breadcrumbs [@fadeInRight] [crumbs]="['Tables']" current="Roles"></fury-breadcrumbs>
  </fury-page-layout-header>

  <fury-page-layout-content [@fadeInUp]>
    <fury-list name="roles" [columns]="columns" (filterChange)="onFilterChange($event)">
      <div class="actions" *ngIf="hasPermission('CREATROLMET01')">
        <button class="create" (click)="createRol()" type="button" mat-mini-fab color="primary">
          <mat-icon>add</mat-icon>
        </button>
      </div>

      <table [dataSource]="dataSource" mat-table matSort>

        <ng-container matColumnDef="name_rol">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre Rol</th>
          <td mat-cell *matCellDef="let row">{{ row.name_rol }}</td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Descripción</th>
          <td mat-cell *matCellDef="let row">{{ row.description }}</td>
        </ng-container>

        <!-- <ng-container matColumnDef="id_fraccionamiento">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Fraccionamiento</th>
          <td mat-cell *matCellDef="let row">{{ row.id_fraccionamiento }}</td>
        </ng-container> -->

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">
            <button *ngIf="hasPermission('DELTROLMET01') || hasPermission('UPDTROLMET01')"  mat-icon-button [matMenuTriggerFor]="actionsMenu" (click)="$event.stopPropagation()">
              <mat-icon>more_horiz</mat-icon>
            </button>
            <mat-menu #actionsMenu="matMenu">
              <ng-container *ngIf="hasPermission('UPDTROLMET01')">
                <button mat-menu-item (click)="updateRol(row)">
                  <span>Modificar</span>
                </button>
              </ng-container>
              <ng-container *ngIf="hasPermission('DELTROLMET01')">
                <button mat-menu-item (click)="deleteRol(row)">
                  <span>Eliminar</span>
                </button>
              </ng-container>
            </mat-menu>
          </td>
        </ng-container>

        <tr *matHeaderRowDef="visibleColumns" mat-header-row></tr>
        <tr (click)="hasPermission('UPDTROLMET01') && updateProveedor(row)"
            *matRowDef="let row; columns: visibleColumns;"
            class="clickable route-animations-elements"
            mat-row></tr>
      </table>

      <mat-paginator class="paginator"  [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions"></mat-paginator>
    </fury-list>
  </fury-page-layout-content>
</fury-page-layout>
