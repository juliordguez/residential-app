<h2 mat-dialog-title>{{ isCreateMode() ? 'Crear Casa' : 'Editar Casa' }}</h2>

<mat-dialog-content [formGroup]="form">
  <div fxLayout="column" fxLayoutGap="16px">

    <mat-form-field appearance="outline">
      <mat-label>Número de Casa</mat-label>
      <input matInput formControlName="numero_casa" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>ID Fraccionamiento</mat-label>
      <input matInput type="number" formControlName="id_fraccionamiento" />
    </mat-form-field>

  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Cancelar</button>
  <button mat-flat-button color="primary" [disabled]="form.invalid" (click)="save()">
    {{ isCreateMode() ? 'Crear' : 'Actualizar' }}
  </button>
</mat-dialog-actions>
