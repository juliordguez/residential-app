<!-- Contenedor del layout de Fury -->
<fury-page-layout mode="card">
  <fury-page-layout-header>
    <fury-breadcrumbs [@fadeInRight] [crumbs]="['Catálogos']" current="Proveedores"></fury-breadcrumbs>
  </fury-page-layout-header>

  <fury-page-layout-content [@fadeInUp]>
    <fury-list name="proveedores" [columns]="columns" (filterChange)="onFilterChange($event)">

      <!-- Botón crear proveedor -->
      <div *ngIf="hasPermission('CREATPRVDRMET01')" class="actions">
        <button class="create" (click)="createProveedor()" type="button" mat-mini-fab color="primary">
          <mat-icon>add</mat-icon>
        </button>
      </div>

      <!-- CUERPO CON SCROLL -->
      <div class="tabla-body-scroll">
        <div class="matriz-proveedores">
          <div class="proveedor-item" *ngFor="let row of paginatedData; let i = index">
            <mat-card class="mat-elevation-z4 proveedor-card-moderno">
              <div class="foto-proveedor-wrapper">
                <img
                  class="foto-proveedor"
                  [src]="row.url_imagen || 'assets/img/default-service.png'"
                  (error)="row.url_imagen = 'assets/img/default-service.png'"
                  alt="{{ row.nombre }}"
                />
              </div>

              <div class="card-content">
                <h3 class="nombre">{{ row.nombre || 'Sin nombre' }}</h3>
                <p class="rol">{{ row.tipo_servicio || 'Sin tipo asignado' }}</p>

                <div class="info-extra">
                  <ng-container *ngFor="let column of columns">
                    <div *ngIf="column.isModelProperty">
                      <!-- <strong>{{ column.name }}:</strong> {{ row[column.property] || '—' }} -->
                      {{ row[column.property] || '—' }}
                    </div>
                  </ng-container>
                </div>

                <div class="acciones-sociales">
                  <a href="#"><i class="fas fa-times"></i></a>
                  <a href="#"><i class="fab fa-linkedin-in"></i></a>
                </div>
              </div>

              <!-- Menú de acciones -->
              <div class="acciones-menu" *ngIf="hasPermission('UPDTPRVDRMET01') || hasPermission('DELTPRVDRMET01')">
                <button mat-icon-button [matMenuTriggerFor]="menu" (click)="activeMenuIndex = i">
                  <mat-icon>more_vert</mat-icon>
                </button>
              </div>
            </mat-card>
          </div>
        </div>
      </div>

      <!-- Menú único -->
      <mat-menu #menu="matMenu">
        <button mat-menu-item *ngIf="hasPermission('UPDTPRVDRMET01')" (click)="updateProveedor(paginatedData[activeMenuIndex!])">Modificar</button>
        <button mat-menu-item *ngIf="hasPermission('DELTPRVDRMET01')" (click)="deleteProveedor(paginatedData[activeMenuIndex!])">Eliminar</button>
      </mat-menu>

      <!-- Paginador -->
      <mat-paginator class="paginator"
                    [length]="dataSource?.data.length || 0"
                    [pageSize]="pageSize"
                    [pageSizeOptions]="pageSizeOptions"
                    (page)="onPageChange($event)">
      </mat-paginator>

    </fury-list>
  </fury-page-layout-content>
</fury-page-layout>
