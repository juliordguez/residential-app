<fury-page-layout mode="card">
  <fury-page-layout-header>
    <fury-breadcrumbs [@fadeInRight] [crumbs]="['Mascotas']" current="Lista"></fury-breadcrumbs>
  </fury-page-layout-header>

  <fury-page-layout-content [@fadeInUp]>
    <fury-list name="mascotas" [columns]="columns" (filterChange)="onFilterChange($event)">

      <!-- Botón crear mascota -->
      <div *ngIf="hasPermission('CREATUSRMET01')" class="actions">
        <button class="create" (click)="createMascota()" type="button" mat-mini-fab color="primary">
          <mat-icon>add</mat-icon>
        </button>
      </div>

      <!-- CUERPO DE TABLA CON SCROLL -->
      <div class="tabla-body-scroll">
        <div class="matriz-mascotas">
          <div class="mascota-item" *ngFor="let row of paginatedData">
            <mat-card class="mat-elevation-z4 mascota-card-horizontal">
              <div fxLayout="row" fxFlexFill class="card-wrapper">

                <!-- Lado izquierdo -->
                <div fxFlex="0 0 180px" class="lado-izquierdo" fxLayout="column" fxLayoutAlign="center center">
                <img
                  class="foto-mascota"
                  [src]="row.foto_url || '../../assets/img/default-pet.png'"
                  (error)="row.foto_url = '../../assets/img/default-pet.png'"
                  alt="{{ row.nombre }}"
                />
                  <div class="casa">
                    🏠 {{ row.ubicacion || 'Sin casa asignada' }}
                  </div>
                </div>

                <!-- Lado derecho -->
                <div fxFlex="1 1 0" class="lado-derecho" fxLayout="column" fxLayoutGap="6px" fxLayoutAlign="center start">
                  <ng-container *ngFor="let column of columns">
                    <div *ngIf="column.isModelProperty" class="dato">
                      <strong>{{ column.name }}:</strong> {{ row[column.property] || '—' }}
                    </div>
                  </ng-container>
                </div>
              </div>

              <!-- Menú de acciones -->
              <div class="acciones-menu" *ngIf="hasPermission('UPDTMSCTMET01') || hasPermission('DELTMSCTMET01')">
                <button mat-icon-button [matMenuTriggerFor]="menu">
                  <mat-icon>more_vert</mat-icon>
                </button>
                <mat-menu #menu="matMenu">
                  <button mat-menu-item *ngIf="hasPermission('UPDTMSCTMET01')" (click)="editMascota(row)">Editar</button>
                  <button mat-menu-item *ngIf="hasPermission('DELTMSCTMET01')" (click)="deleteMascota(row)">Eliminar</button>
                </mat-menu>
              </div>

            </mat-card>
          </div>
        </div>
      </div>

      <!-- Paginador -->
      <mat-paginator class="paginator"
                    [length]="dataSource?.data.length || 0"
                    [pageSize]="pageSize"
                    [pageSizeOptions]="pageSizeOptions"
                    (page)="onPageChange($event)">
      </mat-paginator>

    </fury-list>
  </fury-page-layout-content>
</fury-page-layout>
