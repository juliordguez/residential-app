<h2 mat-dialog-title>{{ isCreateMode() ? 'Registrar Mascota' : 'Editar Mascota' }}</h2>
<mat-dialog-content [formGroup]="form">
  <div fxLayout="column" fxLayoutGap="16px">

    <mat-form-field appearance="outline">
      <mat-label>ID Usuario</mat-label>
      <input matInput type="number" formControlName="id_user">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Tipo de Mascota</mat-label>
      <input matInput type="number" formControlName="id_tipo_mascota">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Tamaño</mat-label>
      <input matInput type="number" formControlName="id_tamanho">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Edad</mat-label>
      <input matInput type="number" formControlName="edad">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Temperamento</mat-label>
      <input matInput type="number" formControlName="id_temperamento">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre">
    </mat-form-field>

  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="form.invalid">
    {{ isCreateMode() ? 'Registrar' : 'Guardar' }}
  </button>
</mat-dialog-actions>
