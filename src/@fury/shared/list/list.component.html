<div class="fury-list-table" style="height: 72vh; overflow-y: auto;">
  
  <!-- Header fijo -->
  <div class="fury-list-header"
       style="position: sticky; top: 0; z-index: 10;"
       *ngIf="!hideHeader"
       fxLayout="row"
       fxLayoutAlign="start center"
       fxLayoutGap="8px"
       fxLayoutGap.gt-xs="24px">

    <div fxLayout="row" fxLayoutAlign="start center" fxFlex>
      <mat-icon class="fury-filter-input-icon">search</mat-icon>
      <input fxFlex style="width: 20px;" class="fury-filter-input" #filter placeholder="Search&hellip;">
    </div>

    <!-- <button class="fury-column-filter" type="button" mat-icon-button [matMenuTriggerFor]="columnFilter">
      <mat-icon>filter_list</mat-icon>
    </button> -->
    <ng-content select=".actions"></ng-content>
  </div>

  <mat-menu #columnFilter="matMenu" yPosition="below" xPosition="before">
    <div class="checkbox-item mat-menu-item"
         *ngFor="let column of columns"
         (click)="toggleColumnVisibility(column, $event)">
      <mat-checkbox [(ngModel)]="column.visible" class="checkbox" #checkbox (click)="$event.stopPropagation()">
        {{ column.name }}
      </mat-checkbox>
    </div>
  </mat-menu>

  <!-- Contenido scrollable -->
  <div style="height: 50vh; padding: 3px;">
    <ng-content></ng-content>
  </div>

</div>
