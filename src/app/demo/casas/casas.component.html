<fury-page-layout mode="card">
  <fury-page-layout-header>
    <fury-breadcrumbs [crumbs]="['Administración']" current="Casas"></fury-breadcrumbs>
  </fury-page-layout-header>

  <fury-page-layout-content>
    <fury-list name="casas" (filterChange)="dataSource.filter = $event.trim().toLowerCase()">
      <div class="actions">
        <button class="create" (click)="createCasa()" mat-mini-fab color="primary">
          <mat-icon>add</mat-icon>
        </button>
      </div>

      <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">

        <ng-container matColumnDef="id_casa">
          <th mat-header-cell *matHeaderCellDef> ID </th>
          <td mat-cell *matCellDef="let casa"> {{ casa.id_casa }} </td>
        </ng-container>

        <ng-container matColumnDef="numero_casa">
          <th mat-header-cell *matHeaderCellDef> Casa </th>
          <td mat-cell *matCellDef="let casa"> {{ casa.numero_casa }} </td>
        </ng-container>

        <ng-container matColumnDef="cantidad_usuarios">
          <th mat-header-cell *matHeaderCellDef> #Usuarios </th>
          <td mat-cell *matCellDef="let casa"> {{ casa.cantidad_usuarios }} </td>
        </ng-container>

        <ng-container matColumnDef="nombres_usuarios">
          <th mat-header-cell *matHeaderCellDef> Usuarios </th>
          <td mat-cell *matCellDef="let casa"> {{ casa.nombres_usuarios }} </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let casa">
            <button mat-icon-button [matMenuTriggerFor]="menu">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="editCasa(casa)">Editar</button>
              <button mat-menu-item (click)="deleteCasa(casa.id_casa)">Eliminar</button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 25]"></mat-paginator>
    </fury-list>
  </fury-page-layout-content>
</fury-page-layout>
