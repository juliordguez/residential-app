<h2 mat-dialog-title>{{ isCreateMode() ? 'Crear Vehículo' : 'Editar Vehículo' }}</h2>

<mat-dialog-content [formGroup]="form" style="padding-top: 16px;">
  <div fxLayout="column" fxLayoutGap="16px">
    <mat-form-field appearance="outline">
      <mat-label>Placas*</mat-label>
      <input matInput formControlName="placas">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Marca*</mat-label>
      <input matInput formControlName="marca">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Modelo*</mat-label>
      <input matInput formControlName="modelo">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Año*</mat-label>
      <input matInput type="number" formControlName="anio">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Color*</mat-label>
      <input matInput formControlName="color">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Tipo de Vehículo*</mat-label>
      <mat-select formControlName="id_tipo">
        <mat-option [value]="null">-- Selecciona un tipo --</mat-option>
        <mat-option *ngFor="let tipo of tipos" [value]="tipo.id_tipo">
          {{ tipo.nombre_tipo }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Usuario*</mat-label>
      <mat-select formControlName="user_uuid">
        <mat-option [value]="null">-- Selecciona un usuario --</mat-option>
        <mat-option *ngFor="let usuario of usuarios" [value]="usuario.user_uuid">
          {{ usuario.username }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="form.invalid">
    {{ isCreateMode() ? 'Crear' : 'Guardar' }}
  </button>
</mat-dialog-actions>
