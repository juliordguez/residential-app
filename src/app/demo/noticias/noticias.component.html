<fury-page-layout mode="card">
  <fury-page-layout-header>
    <fury-breadcrumbs [@fadeInRight] [crumbs]="['Gestión']" current="Noticias"></fury-breadcrumbs>
  </fury-page-layout-header>

  <fury-page-layout-content [@fadeInUp]>
    <fury-list name="noticias" [columns]="columns" (filterChange)="onFilterChange($event)">
      <div *ngIf="hasPermission('CREATNTCMET01')" class="actions">
        <button class="create" (click)="createNoticia()" type="button" mat-mini-fab color="primary">
          <mat-icon>add</mat-icon>
        </button>
      </div>

      <table [dataSource]="dataSource" mat-table matSort>

        <!-- Checkbox -->
        <ng-container matColumnDef="checkbox">
          <th mat-header-cell *matHeaderCellDef>
            <mat-checkbox color="primary"></mat-checkbox>
          </th>
          <td mat-cell *matCellDef="let row">
            <mat-checkbox color="primary"></mat-checkbox>
          </td>
        </ng-container>

        <!-- Columnas dinámicas -->
        <ng-container *ngFor="let column of columns">
          <ng-container *ngIf="column.isModelProperty" [matColumnDef]="column.property">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ column.name }}</th>
            <!-- <td mat-cell *matCellDef="let row">{{ row[column.property] }}</td> -->
                     <td mat-cell *matCellDef="let row">
                        <ng-container *ngIf="isDate(row[column.property]); else noFormato">
                          {{ row[column.property] | date:'yyyy-MM-dd HH:mm' }}
                        </ng-container>
                        <ng-template #noFormato>
                          {{ row[column.property] }}
                        </ng-template>
                      </td>
          </ng-container>
        </ng-container>

        <!-- Acciones -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">
            <button *ngIf="hasPermission('DELTNTCMET01') || hasPermission('UPDTNTCMET01')" type="button" mat-icon-button [matMenuTriggerFor]="actionsMenu" (click)="$event.stopPropagation()">
              <mat-icon>more_horiz</mat-icon>
            </button>

            <mat-menu #actionsMenu="matMenu">
                <ng-container *ngIf="hasPermission('UPDTNTCMET01')">
                  <button mat-menu-item (click)="updateNoticia(row)">
                    <span>Editar</span>
                  </button>
                </ng-container>
                <ng-container *ngIf="hasPermission('DELTNTCMET01')">
                  <button mat-menu-item (click)="deleteNoticia(row)">
                    <span>Eliminar</span>
                  </button>
                </ng-container>
                <!-- <ng-container *ngIf="hasPermission('UPDTUSRMET01')">
                </ng-container> -->
            </mat-menu>
          </td>
        </ng-container>

        <tr *matHeaderRowDef="visibleColumns" mat-header-row></tr>
        <tr (click)="hasPermission('UPDTNTCMET01') && updateNoticia(row)"
            *matRowDef="let row; columns: visibleColumns;"
            class="clickable route-animations-elements"
            mat-row></tr>
      </table>

      <mat-paginator class="paginator"  [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions"></mat-paginator>
    </fury-list>
  </fury-page-layout-content>
</fury-page-layout>
